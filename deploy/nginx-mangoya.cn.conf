server
{
    listen 80;
    listen 443 ssl http2 ;
    server_name mangoya.cn www.mangoya.cn;

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/mangoya.cn.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL相关配置
    ssl_certificate    /www/server/panel/vhost/cert/mangoya.cn/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/mangoya.cn/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;
    #SSL-END

    # ACME HTTP-01 验证目录（Let's Encrypt 证书签发 / 自动续期）
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/acme-challenge;
        default_type text/plain;
        allow all;
    }

    # 反向代理到 Next.js 容器 (myblog3.0)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    access_log  /www/wwwlogs/mangoya.cn.log;
    error_log  /www/wwwlogs/mangoya.cn.error.log;
}
